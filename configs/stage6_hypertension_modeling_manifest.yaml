project: P6 population-valid agentic clinical prediction
outcome:
  name: undiagnosed_hypertension
  definition: >
    Elevated measured blood pressure (mean systolic >= 130 or mean diastolic >= 80),
    no self-reported prior hypertension awareness, and no current prescribed
    antihypertensive medication.
  labeled_rows_only: true

cohort:
  artifact: outputs/cohorts/P6_STAGE6_hypertension_cohort_20261023T163306Z.csv
  audit: outputs/cohorts/P6_STAGE6_hypertension_cohort_20261023T163306Z_audit.csv
  metadata: outputs/cohorts/P6_STAGE6_hypertension_cohort_20261023T163306Z_audit_metadata.json
  development_cycles:
    - "2011-2012"
    - "2013-2014"
    - "2015-2016"
  temporal_test_cycle: "2021-2023"

evaluation:
  development_validation: leave_one_cycle_out
  final_test: locked_temporal_2021_2023
  primary_selection_metric: weighted_brier_score
  secondary_metrics:
    - weighted_auprc
    - weighted_auroc
    - calibration_intercept
    - calibration_slope
    - expected_calibration_error
    - sensitivity
    - specificity
    - ppv
    - npv
    - referral_fraction
  weighting_column: WTMEC2YR
  design_columns:
    - SDMVSTRA
    - SDMVPSU

forbidden_predictors:
  - SEQN
  - WTMEC2YR
  - SDMVSTRA
  - SDMVPSU
  - mean_systolic_bp
  - mean_diastolic_bp
  - elevated_bp_130_80
  - known_hypertension
  - taking_hypertension_medication
  - undiagnosed_hypertension
  - outcome_missing_reason
  - nhanes_cycle

model_families:
  core:
    - elastic_net_logistic_regression
    - extra_trees
    - catboost
    - lightgbm
    - resnet_mlp
    - ft_transformer
    - tabnet
    - tabicl_v2
    - tabpfn_2_5
  extended_sensitivity:
    - xgboost
    - saint
    - rbf_svm

selection_rule:
  - lowest_mean_weighted_brier_score
  - highest_mean_weighted_auprc
  - highest_mean_weighted_auroc
  - lower_complexity_as_tiebreaker

governance:
  no_temporal_test_access_before_model_lock: true
  preprocessing_fit_on_training_only: true
  fixed_random_seeds: true
  preserve_missingness_indicators: true
  model_and_package_versions_logged: true