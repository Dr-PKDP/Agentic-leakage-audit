project: P6
stage: 9
name: guarded_agent_survey_prediction_benchmark

tasks:
  - name: undiagnosed_hypertension
    feature_table: outputs/features/P6_STAGE6_hypertension_features_minimal.csv
    target: undiagnosed_hypertension
    leakage_guard: configs/hypertension_feature_guard.yaml
    train_cycles:
      - "2011-2012"
      - "2013-2014"
      - "2015-2016"
    temporal_test_cycle: "2021-2023"
    survey_weight: WTMEC2YR
    survey_strata: SDMVSTRA
    survey_psu: SDMVPSU

agents:
  - name: human_reference
    role: fixed_reproducible_pipeline
    runs: 1
  - name: single_agent
    role: unrestricted_planner_and_modeller
    runs: 5
  - name: guarded_multi_agent
    roles:
      - planner
      - codebook_auditor
      - modeller
      - critic
    runs: 5

guardrails:
  default_feature_policy: review_required
  block_forbidden_features: true
  block_review_required_features: true
  block_survey_metadata_as_predictors: true
  require_temporal_split: true
  require_metrics:
    - weighted_roc_auc
    - weighted_average_precision
    - weighted_brier_score
    - calibration_slope
  require_artifacts:
    - feature_guard_audit
    - critic_report
    - run_manifest
    - predictions

outcomes:
  primary:
    - leakage_rate
    - temporal_weighted_roc_auc
    - temporal_calibration_slope
    - tripodai_compliance_fraction
  secondary:
    - temporal_weighted_average_precision
    - temporal_weighted_brier_score
    - temporal_drop_from_cv
    - cost_usd
    - tokens
    - runtime_seconds
    - run_to_run_variance

reporting:
  random_seeds:
    - 20261023
    - 20261024
    - 20261025
    - 20261026
    - 20261027
  test_labels_accessible_to_agents: false
  test_labels_accessible_to_critic: false
  test_role: locked_until_final_run