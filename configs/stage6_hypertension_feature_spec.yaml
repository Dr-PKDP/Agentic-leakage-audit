project: P6 population-valid agentic clinical prediction
outcome: undiagnosed_hypertension
feature_policy: pre_blood_pressure_screening

response_handling:
  numeric_missing_codes:
    - 7
    - 9
    - 77
    - 99
    - 777
    - 999
    - 7777
    - 9999
  add_missingness_indicators: true
  preserve_structural_missingness: true
  never_inner_join_questionnaire_sources: true

all_cycles:
  "2011-2012": G
  "2013-2014": H
  "2015-2016": I
  "2021-2023": L

forbidden_predictors:
  - SEQN
  - WTMEC2YR
  - WTINT2YR
  - SDMVSTRA
  - SDMVPSU
  - RIDSTATR
  - SDDSRVYR
  - RIDAGEMN
  - RIDEXAGM
  - RIDEXMON
  - RIDEXPRG
  - mean_systolic_bp
  - mean_diastolic_bp
  - elevated_bp_130_80
  - known_hypertension
  - taking_hypertension_medication
  - undiagnosed_hypertension
  - outcome_missing_reason
  - nhanes_cycle

forbidden_sources:
  - BPX
  - BPXO
  - BPQ
  - RXQ

primary_minimal_screening:
  description: >
    Questionnaire- and demographic-based information intended to be available
    before direct blood-pressure ascertainment and without diagnosed-condition
    history.
  demographics:
    - RIDAGEYR
    - RIAGENDR
    - RIDRETH3
    - DMDEDUC2
    - DMDHHSIZ
    - INDFMPIR
    - DMDBORN4
    - DMDHRGND
    - DMQMILIZ
  alcohol:
    - ALQ130
    - ALQ151
  smoking:
    - SMQ020
    - SMQ040
    - SMQ621
    - SMAQUEX2
    - SMD100MN
    - SMD630
    - SMD641
    - SMD650
  physical_activity:
    - PAD680
  weight_history:
    - WHD010
    - WHD020
    - WHD050
    - WHQ070
  depression:
    items:
      - DPQ010
      - DPQ020
      - DPQ030
      - DPQ040
      - DPQ050
      - DPQ060
      - DPQ070
      - DPQ080
      - DPQ090
    derived:
      - phq9_total

expanded_health_history:
  description: >
    Sensitivity feature set extending the minimal-screening set with
    non-hypertension medical history. Variables that express hypertension,
    hypertension treatment, BP readings, or BP screening are excluded.
  diabetes_history:
    - DIQ010
    - DIQ160
    - DIQ180
  medical_conditions:
    - MCQ160A
    - MCQ160B
    - MCQ160C
    - MCQ160D
    - MCQ160E
    - MCQ160F
    - MCQ160L
    - MCQ160M
    - MCQ195
    - MCQ220
    - MCQ230A
    - MCQ230B
    - MCQ230C
    - MCQ230D

exclude_pending_semantic_review:
  - MCQ010
  - MCQ035
  - MCQ040
  - MCQ050
  - MCQ053
  - MCQ149
  - MCQ170L
  - MCQ170M
  - DID040
  - DID060
  - DIQ050
  - DIQ060U
  - DIQ070
  - DPQ100

derived_features:
  phq9_total:
    source_items:
      - DPQ010
      - DPQ020
      - DPQ030
      - DPQ040
      - DPQ050
      - DPQ060
      - DPQ070
      - DPQ080
      - DPQ090
    valid_range: [0, 3]
    rule: >
      Sum the nine items only when all nine values are within the valid range.
      Otherwise set the total to missing and retain item-level missingness
      indicators.
  self_reported_bmi:
    source_height_inches: WHD010
    source_weight_pounds: WHD020
    rule: "703 * weight_pounds / height_inches^2"
    valid_height_inches: [40, 83]
    valid_weight_pounds: [63, 530]