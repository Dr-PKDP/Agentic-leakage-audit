project: P6
stage: 8
task: undiagnosed_hypertension
target: undiagnosed_hypertension

feature_file: P6_STAGE6_hypertension_features_minimal.csv
feature_dir: outputs/features
output_dir: outputs/models

training_cycles:
  - "2011-2012"
  - "2013-2014"

calibration_cycle: "2015-2016"

previously_accessed_temporal_evaluation_cycle: "2021-2023"
allow_2021_2023_for_model_selection: false
allow_2021_2023_for_calibrator_fitting: false

id_columns:
  - SEQN
  - nhanes_cycle

excluded_from_predictors:
  - undiagnosed_hypertension
  - WTMEC2YR
  - SDMVSTRA
  - SDMVPSU

survey_design:
  weight: WTMEC2YR
  strata: SDMVSTRA
  psu: SDMVPSU

base_model:
  name: random_forest
  n_estimators: 500
  min_samples_leaf: 10
  class_weight: balanced
  random_seed: 20261023

calibration:
  method: platt_scaling
  fit_cycle: "2015-2016"
  use_sample_weight: true

evaluation:
  primary_cycle: "2015-2016"
  reported_metrics:
    - weighted_roc_auc
    - weighted_average_precision
    - weighted_brier_score
    - calibration_slope
    - calibration_intercept
  threshold_grid:
    start: 0.10
    stop: 0.50
    step: 0.01