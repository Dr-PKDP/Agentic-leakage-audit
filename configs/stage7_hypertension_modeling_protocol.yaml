project: P6
stage: 7
task: undiagnosed_hypertension
target: undiagnosed_hypertension

feature_sets:
  primary: P6_STAGE6_hypertension_features_minimal.csv
  secondary: P6_STAGE6_hypertension_features_expanded.csv

data_paths:
  feature_dir: outputs/features
  output_dir: outputs/models

temporal_split:
  development_cycles:
    - "2011-2012"
    - "2013-2014"
    - "2015-2016"
  final_test_cycle: "2021-2023"

id_columns:
  - SEQN
  - nhanes_cycle

target_exclusions:
  - undiagnosed_hypertension
  - WTMEC2YR
  - SDMVSTRA
  - SDMVPSU

survey_design:
  weight: WTMEC2YR
  strata: SDMVSTRA
  psu: SDMVPSU
  primary_metric_weighted: true

models:
  - name: logistic_regression
    type: elastic_net_logistic_regression
  - name: random_forest
    type: random_forest_classifier
  - name: hist_gradient_boosting
    type: hist_gradient_boosting_classifier

cross_validation:
  folds: 5
  random_seed: 20261023
  stratified: true
  use_development_cycles_only: true

preprocessing:
  numeric_imputation: median
  categorical_imputation: most_frequent
  one_hot_encode_categoricals: true
  include_missingness_indicators: true
  fit_preprocessing_on_training_fold_only: true

metrics:
  discrimination:
    - roc_auc
    - average_precision
  calibration:
    - brier_score
    - calibration_intercept
    - calibration_slope
  clinical_utility:
    - sensitivity
    - specificity
    - ppv
    - npv
  uncertainty:
    bootstrap_replicates: 1000
    bootstrap_unit: participant
    confidence_level: 0.95

selection_rule:
  primary_feature_set: minimal
  primary_model_selection_metric: weighted_roc_auc_cv_mean
  tie_breakers:
    - weighted_brier_score_cv_mean
    - calibration_slope_distance_from_one
  test_set_access: final_only